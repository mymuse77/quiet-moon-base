<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Moon Base</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --hud:rgba(12,14,28,.66);
  --hud-hi:rgba(22,26,48,.82);
  --fg:#eef0ff;
  --mut:#a9aed0;
  --acc:#f2b866;
  --danger:#ff6b6b;
  --bar:rgba(255,255,255,.18);
  --bg:#000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Zen Kaku Gothic New","Noto Sans SC","Noto Sans KR","PingFang SC","Malgun Gothic",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}

/* Top-left HUD panel */
.panel{
  position:absolute;top:14px;left:14px;width:264px;max-width:calc(100% - 28px);
  max-height:calc(100% - 28px);overflow:auto;
  background:var(--hud);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font-size:14px;z-index:3
}
h1{font-size:16px;font-weight:500;margin:0 0 8px;letter-spacing:.02em}
.m{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:4px 0}
.m span{width:54px;flex-shrink:0}
.bar{flex:1;height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;transition:width .35s,background-color .35s}
@keyframes pulseLow{0%,100%{opacity:1;box-shadow:0 0 0 rgba(255,90,90,0)}50%{opacity:.45;box-shadow:0 0 10px rgba(255,90,90,.85)}}
.m.low span{color:var(--danger);font-weight:500}
.m.low .bar{background:rgba(255,90,90,.28)}
.m.low .bar i{background:var(--danger)!important;animation:pulseLow 1s infinite}

.inv-box{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:4px;font-size:13px}
.inv-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--fg)}
.inv-item{display:inline-flex;align-items:center;gap:3px;cursor:default}
.inv-sub{font-size:12px;color:var(--mut)}
.inv-warn{color:var(--danger);font-weight:500;margin-left:4px}

/* Task Header & Collapsible Task List */
.task-head{
  margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
#taskCount{font-size:13px;color:var(--fg);font-weight:500}
#taskToggle{
  font:inherit;font-size:12px;color:var(--fg);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:3px 10px;
  cursor:pointer;display:inline-flex;align-items:center;gap:4px;
  transition:background .2s,border-color .2s;touch-action:manipulation
}
#taskToggle:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
#tasks{list-style:none;margin:8px 0 0;padding:0;font-size:13px;line-height:1.68}
#tasks.hidden{display:none!important}
#tasks li{color:var(--mut)}
#tasks li.ok{color:var(--acc)}

/* Top-center Compass */
#compass{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:min(320px,calc(100% - 360px));min-width:180px;height:30px;
  background:var(--hud);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;overflow:hidden;
  pointer-events:none;z-index:2
}
#compass.hidden{display:none}
#compassTrack{position:relative;width:100%;height:100%}
.c-tick{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:11px;color:rgba(238,240,255,.6);font-weight:500}
.c-mark{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;font-size:10px;color:var(--fg);white-space:nowrap}
.c-dot{width:7px;height:7px;border-radius:50%;box-shadow:0 0 6px currentColor}
#compassCenter{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(242,184,102,.7);transform:translateX(-.5px)}

/* Top-right controls */
#langs{position:absolute;top:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 290px);z-index:3}
#langs button{
  font:inherit;font-size:13px;color:var(--fg);background:var(--hud);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 11px;cursor:pointer;
  transition:background .18s,color .18s
}
#langs button:hover{background:var(--hud-hi)}
#langs button[aria-pressed="true"]{background:var(--fg);color:#14162a;border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* Toasts, prompts, progress */
#toast{
  position:absolute;left:50%;bottom:66px;transform:translateX(-50%);
  max-width:min(560px,calc(100% - 32px));background:var(--hud-hi);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 18px;
  font-size:14px;text-align:center;opacity:0;transition:opacity .45s;pointer-events:none;z-index:4
}
#toast.on{opacity:1}
#hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;color:var(--mut);padding:0 12px;pointer-events:none;z-index:2}
#prompt{
  position:absolute;left:50%;bottom:124px;transform:translateX(-50%);
  background:var(--hud-hi);border:1px solid rgba(255,255,255,.18);border-radius:12px;
  padding:8px 16px;font-size:15px;pointer-events:none;z-index:4;white-space:nowrap
}
#prompt:empty{display:none}
#prog{position:absolute;left:50%;bottom:108px;width:184px;margin-left:-92px;height:6px;border-radius:3px;background:var(--bar);overflow:hidden;opacity:0;pointer-events:none;z-index:4}
#prog.on{opacity:1}
#prog i{display:block;height:100%;width:0;background:var(--acc)}

/* Fade transition overlay */
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .75s ease;z-index:8}
#fade.on{opacity:1}

/* Overlays: faint/dead, pause, photo shot */
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.78);font-size:20px;text-align:center;padding:24px;z-index:7}
#ov.on{display:flex}
#ov button{font:inherit;color:#14162a;background:var(--fg);border:0;border-radius:999px;padding:8px 22px;cursor:pointer}

#pause,#shot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.68);z-index:9;padding:16px}
#pause.on,#shot.on{display:flex}
.pbox{
  background:rgba(16,19,36,.96);border:1px solid rgba(255,255,255,.14);border-radius:18px;
  padding:20px 24px;max-width:430px;width:100%;display:flex;flex-direction:column;gap:12px;font-size:14px
}
.pbox h2{margin:0;font-size:20px;font-weight:500}
.pbox p{margin:0;color:var(--mut);font-size:13px;line-height:1.6}
.pbox label{display:flex;align-items:center;gap:12px}
.pbox label span{width:130px;flex-shrink:0}
.pbox input[type="range"]{flex:1}
.pbox input[type="checkbox"]{width:18px;height:18px;accent-color:var(--acc);cursor:pointer}
.pb{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.pb button,#shot button{font:inherit;color:#14162a;background:var(--fg);border:0;border-radius:999px;padding:8px 18px;cursor:pointer}

#shot{flex-direction:column;gap:12px}
#shot img{max-width:92%;max-height:74%;border-radius:12px;border:1px solid rgba(255,255,255,.2)}
#shot div{color:var(--mut);font-size:13px}

/* Photo mode HUD */
#pho{
  display:none;position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--hud);border:1px solid rgba(255,255,255,.18);border-radius:999px;
  padding:6px 14px;align-items:center;gap:10px;font-size:13px;color:var(--mut);z-index:5
}
#pho button{
  font:inherit;font-size:13px;color:#14162a;background:var(--fg);border:0;border-radius:999px;
  padding:4px 12px;cursor:pointer
}
#pho button.sec{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.35)}
#app.photo #pho{display:flex}
#app.photo .panel,#app.photo #langs,#app.photo #hint,#app.photo #prompt,#app.photo #prog,#app.photo #toast,#app.photo #compass,#app.photo #touchUI{display:none!important}

/* Mobile / Virtual Touch Controls */
#touchUI{position:absolute;inset:0;pointer-events:none;display:none;z-index:4}
#touchUI.on{display:block}
#joyBase{
  position:absolute;left:22px;bottom:52px;width:116px;height:116px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.26);
  pointer-events:auto;touch-action:none
}
#joyKnob{
  position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(238,240,255,.45);border:1px solid rgba(255,255,255,.7);
  pointer-events:none
}
#touchBtns{
  position:absolute;right:18px;bottom:52px;display:grid;grid-template-columns:repeat(2,58px);gap:10px;
  pointer-events:auto
}
#touchBtns button{
  width:58px;height:58px;border-radius:50%;font:inherit;font-size:12px;color:var(--fg);
  background:var(--hud-hi);border:1px solid rgba(255,255,255,.32);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  touch-action:manipulation
}
#touchBtns button:active{background:var(--fg);color:#14162a}

@media (max-width:720px){
  .panel{width:215px;padding:10px 12px}
  #compass{display:none}
  #langs{max-width:calc(100% - 235px)}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <!-- Top-Left Status & Collapsible Tasks -->
  <div class="panel" id="hudPanel">
    <h1 data-i="title"></h1>
    <div class="m" id="mo"><span data-i="o2"></span><div class="bar"><i id="bo" style="background:#7fc8f8"></i></div></div>
    <div class="m" id="mp"><span data-i="pw"></span><div class="bar"><i id="bp" style="background:#f2c14e"></i></div></div>
    <div class="m" id="mw"><span data-i="wt"></span><div class="bar"><i id="bw" style="background:#5aa9f0"></i></div></div>
    <div class="m" id="mh"><span data-i="hg"></span><div class="bar"><i id="bh" style="background:#f0955f"></i></div></div>
    <div class="inv-box">
      <div class="inv-row" id="invRes"></div>
      <div class="inv-sub" id="invCrop"></div>
    </div>
    <div class="task-head">
      <span id="taskCount"></span>
      <button id="taskToggle" type="button" aria-expanded="false"></button>
    </div>
    <ul id="tasks" class="hidden"></ul>
  </div>

  <!-- Top-Center Horizontal Compass -->
  <div id="compass" aria-hidden="true">
    <div id="compassTrack"></div>
    <div id="compassCenter"></div>
  </div>

  <!-- Top-Right Action & Language Bar -->
  <div id="langs" role="group" aria-label="Controls"></div>

  <!-- HUD Feedback -->
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="hint" data-i="hint"></div>
  <div id="prompt"></div>
  <div id="prog"><i></i></div>
  <div id="fade"></div>
  <div id="ov"></div>

  <!-- Pause Menu -->
  <div id="pause">
    <div class="pbox">
      <h2 data-i="pTitle"></h2>
      <p id="pauseHint" data-i="hint"></p>
      <label><span data-i="pVol"></span><input type="range" id="rv" min="0" max="1" step=".05"></label>
      <label><span data-i="pMus"></span><input type="range" id="rmu" min="0" max="1" step=".05"></label>
      <label><span data-i="pSens"></span><input type="range" id="rsn" min=".4" max="2" step=".1"></label>
      <label><span data-i="pLock"></span><input type="checkbox" id="rpl"></label>
      <div class="pb">
        <button id="pR" type="button" data-i="pResume"></button>
        <button id="pX" type="button" data-i="pReset"></button>
      </div>
    </div>
  </div>

  <!-- Photo Mode Bar -->
  <div id="pho">
    <span data-i="phoHint"></span>
    <button id="phoCap" type="button" data-i="phoBtn"></button>
    <button id="phoExit" type="button" class="sec" data-i="phoExit"></button>
  </div>

  <!-- Screenshot Modal -->
  <div id="shot">
    <img id="shotImg" alt="Moon Base Photo">
    <div data-i="shotHint"></div>
    <button id="shotX" type="button" data-i="close"></button>
  </div>

  <!-- Virtual Touch Controls -->
  <div id="touchUI">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="touchBtns">
      <button id="tAct" type="button"><span>E</span><small data-i="tUse"></small></button>
      <button id="tJump" type="button"><span>▲</span><small data-i="tJump"></small></button>
      <button id="tEat" type="button"><span>🥔</span><small data-i="tEat"></small></button>
      <button id="tLamp" type="button"><span>🔦</span><small data-i="tLamp"></small></button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   0. ERROR HANDLER & MULTI-CDN THREE.JS LOADER
   ============================================================================ */
(function(){
  const showErr = msg => {
    let d = document.getElementById('err');
    if(!d){ d = document.createElement('div'); d.id = 'err'; document.body.appendChild(d); }
    d.textContent = msg;
    d.style.cssText = 'position:fixed;z-index:99;left:12px;right:12px;bottom:12px;background:#3a1020;color:#ffd9e0;padding:12px 16px;border-radius:12px;font:14px system-ui;white-space:pre-wrap';
  };
  window.addEventListener('error', e => showErr('Error: ' + (e.message || '') + (e.lineno ? ' (line ' + e.lineno + ')' : '')));
  try{
    const c = document.createElement('canvas');
    if(!(c.getContext('webgl2') || c.getContext('webgl'))){
      showErr('WebGL is not available in this browser. / 此浏览器不支持 WebGL。');
      return;
    }
  }catch(e){}

  const CDNS = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  function loadThree(idx){
    if(window.THREE){ startWhenReady(); return; }
    if(idx >= CDNS.length){
      showErr('Could not load Three.js from any CDN. Please check your network and reload.\n无法加载 3D 引擎库，请检查网络连接后刷新。');
      return;
    }
    const s = document.createElement('script');
    s.src = CDNS[idx];
    s.onload = () => window.THREE ? startWhenReady() : loadThree(idx + 1);
    s.onerror = () => loadThree(idx + 1);
    document.head.appendChild(s);
  }
  function startWhenReady(){
    if(document.readyState === 'complete') initGame();
    else window.addEventListener('load', initGame, { once: true });
  }
  loadThree(0);
})();

const lerp = (a,b,t) => a + (b - a) * t;
const sm = (a,b,x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function rng(s){
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = rng(7);
function hash(x,y){ const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vn(x,y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi,yi), hash(xi+1,yi), u), lerp(hash(xi,yi+1), hash(xi+1,yi+1), u), v);
}
function fbm(x,y){
  let a = .5, f = 1, s = 0;
  for(let i = 0; i < 4; i++){ s += a * vn(x * f, y * f); f *= 2.03; a *= .5; }
  return s;
}

const LAND = { x:-77, z:76 }, GH = { x:-5, z:-12 }, SOL = { x:65, z:52 }, CR = { x:55, z:-57, r:27, d:3.6 };
const COMMS = { x:140, z:-60 }, RUIN = { x:-150, z:40 }, PAD = { x:-40, z:150 }, ICE = { x:-120, z:-110, r:30, d:5 };
// Open, unobstructed spawn facing the warm greenhouse and Earth hanging above
const SPAWN = { x:-42, z:42, h:Math.atan2(GH.x - (-42), GH.z - 42) };
const FLAT = [
  { x:LAND.x, z:LAND.z, r:9 }, { x:GH.x, z:GH.z, r:13 }, { x:SOL.x, z:SOL.z, r:15 },
  { x:COMMS.x, z:COMMS.z, r:9 }, { x:RUIN.x, z:RUIN.z, r:11 }, { x:PAD.x, z:PAD.z, r:12 },
  { x:SPAWN.x, z:SPAWN.z, r:7 }
];
const craters = [CR, ICE];
for(let i = 0; i < 90; i++){
  const r = 2 + Math.pow(rand(), 2.4) * 18;
  craters.push({ x:(rand() - .5) * 480, z:(rand() - .5) * 480, r, d:r * (.14 + rand() * .1) });
}
function H(x,z){
  let h = (fbm(x * .011, z * .011) - .4) * 9 + (fbm(x * .06 + 9, z * .06) - .5) * 1.2;
  for(const c of craters){
    const dx = x - c.x, dz = z - c.z;
    if(Math.abs(dx) > c.r * 1.7 || Math.abs(dz) > c.r * 1.7) continue;
    const d = Math.hypot(dx, dz) / c.r;
    if(d < 1) h -= c.d * (1 - d * d);
    h += c.d * .35 * Math.exp(-Math.pow((d - 1.05) / .18, 2));
  }
  h += sm(215, 295, Math.hypot(x, z)) * (28 + 22 * fbm(x * .012 + 20, z * .012));
  let f = 1;
  for(const a of FLAT) f = Math.min(f, sm(a.r, a.r + 14, Math.hypot(x - a.x, z - a.z)));
  return h * f;
}

}

}
function earthTex(){
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const x = c.getContext("2d"), r = rng(3);
  x.fillStyle = "#2b62b8"; x.fillRect(0,0,512,256);

  for(let i = 0; i < 46; i++){ x.beginPath(); x.ellipse(r()*512, 40+r()*176, 10+r()*34, 8+r()*22, r()*3, 0, 6.3); x.fill(); }
  x.fillStyle = "rgba(255,255,255,.55)";
  for(let i = 0; i < 60; i++){ x.beginPath(); x.ellipse(r()*512, r()*256, 16+r()*40, 3+r()*7, (r()-.5)*.5, 0, 6.3); x.fill(); }
  x.fillStyle = "#eef4fa"; x.fillRect(0,0,512,14); x.fillRect(0,242,512,14);

}

{

let AC = null, au = {}, muted = false, paused = false, vol = 1, sens = 1, music = .6;
try{ muted = localStorage.getItem('qmb-mute') === '1'; }catch(e){}
try{
  const s = JSON.parse(localStorage.getItem('qmb-set') || 'null');
  if(s){
    if(Number.isFinite(s.vol)) vol = s.vol;
    if(Number.isFinite(s.sens)) sens = s.sens;
    if(Number.isFinite(s.music)) music = s.music;
  }
}catch(e){}

const SC2 = [146.83, 164.81, 196, 220, 246.94, 293.66, 329.63];
function ensureAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
  const m = AC.createGain(); m.gain.value = muted ? 0 : vol*.6; m.connect(AC.destination); au.m = m;
  const nb = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate), d = nb.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  au.nb = nb;

  const N = AC.sampleRate*4, ib = AC.createBuffer(2, N, AC.sampleRate);
  for(let c = 0; c < 2; c++){ const x = ib.getChannelData(c); for(let i = 0; i < N; i++) x[i] = (Math.random()*2 - 1)*Math.pow(1 - i/N, 2.5); }
  const mg = AC.createGain(); mg.gain.value = music; mg.connect(m); au.mg = mg;
  const cv = AC.createConvolver(); cv.buffer = ib;
  const wet = AC.createGain(); wet.gain.value = .9; cv.connect(wet); wet.connect(mg);
  const dry = AC.createGain(); dry.gain.value = .5; dry.connect(mg);
  const bus = AC.createGain(); bus.connect(cv); bus.connect(dry); au.bus = bus;
  [[55,.06],[82.41,.03]].forEach(a => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = a[0]; g.gain.value = a[1]; o.connect(g); g.connect(bus); o.start(); });

  const f = AC.createOscillator(), fl = AC.createBiquadFilter(), fg = AC.createGain();
  f.type = 'sawtooth'; f.frequency.value = 96; fl.type = 'lowpass'; fl.frequency.value = 260; fg.gain.value = .002;
  f.connect(fl); fl.connect(fg); fg.connect(m); f.start(); au.fan = fg;

  const s = AC.createBufferSource(); s.buffer = nb; s.loop = true; s.start();
  const hp = AC.createBiquadFilter(); hp.type = 'lowpass'; hp.frequency.value = 240;
  const hs = AC.createGain(); hs.gain.value = 0; s.connect(hp); hp.connect(hs); hs.connect(m); au.hs = hs;

  au.next = 0; au.warn = 0; au.nb2 = 0;
  suitInit();
}
function applyVol(){ if(AC && au.m) au.m.gain.setTargetAtTime(muted ? 0 : vol*.6, AC.currentTime, .05); }
function padNote(){
  const t = AC.currentTime, f = SC2[Math.floor(Math.random()*SC2.length)]*(Math.random() < .3 ? .5 : 1);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = f; o.detune.value = (Math.random() - .5)*8;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + 3); g.gain.linearRampToValueAtTime(0, t + 9);
  o.connect(g); g.connect(au.bus); o.start(t); o.stop(t + 9.5);
}
function beep(){
  const t = AC.currentTime;
  [0, .16].forEach((d,i) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = i ? 740 : 880;
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.06, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .14);
    o.connect(g); g.connect(au.m); o.start(t + d); o.stop(t + d + .16);
  });
}
function clickSnd(t,v){
  const s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = au.nb; b.type = 'highpass'; b.frequency.value = 2200;
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
  s.connect(b); b.connect(g); g.connect(au.m); s.start(t, Math.random()); s.stop(t + .04);
}
function breath(ex){
  const t = AC.currentTime, v = .05 + .04*ex;
  const mk = (f,q,t0,a,d,vv) => {
    const s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = au.nb; b.type = 'bandpass'; b.frequency.value = f; b.Q.value = q;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vv, t0 + a); g.gain.linearRampToValueAtTime(0, t0 + a + d);
    s.connect(b); b.connect(g); g.connect(au.m); s.start(t0, Math.random()); s.stop(t0 + a + d + .05);
  };
  clickSnd(t, .04); mk(1400, 1.1, t, .12, .7, v); mk(900, 1, t + 1.05, .08, 1.1, v*.8);
}
function radioCall(){
  const t = AC.currentTime;
  const q = (f,s) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.05, s + .01); g.gain.setValueAtTime(.05, s + .24); g.gain.linearRampToValueAtTime(0, s + .26);
    o.connect(g); g.connect(au.m); o.start(s); o.stop(s + .28);
  };
  q(2525, t);
  const sn = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
  sn.buffer = au.nb; b.type = 'bandpass'; b.frequency.value = 1500; b.Q.value = .6;
  g.gain.setValueAtTime(0, t + .3); g.gain.linearRampToValueAtTime(.05, t + .4); g.gain.setValueAtTime(.05, t + 3.2); g.gain.linearRampToValueAtTime(0, t + 3.4);
  sn.connect(b); b.connect(g); g.connect(au.m); sn.start(t + .3, Math.random()); sn.stop(t + 3.5);
  q(2475, t + 3.5);
}
function rocketRumble(){
  if(!AC || muted || !au.m) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = au.nb; s.loop = true; b.type = 'lowpass'; b.frequency.value = 140;
  g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.22, t + .35); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
  s.connect(b); b.connect(g); g.connect(au.m); s.start(t); s.stop(t + 1.65);
}
function sfx(k){
  if(!AC || muted || !au.m) return;
  const t = AC.currentTime;
  const tone = (f,d,v,type,dl) => {
    const s = t + (dl || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); o.frequency.exponentialRampToValueAtTime(Math.max(30, f*.6), s + d);
    g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
    o.connect(g); g.connect(au.m); o.start(s); o.stop(s + d);
  };
  const puff = (f,d,v) => {
    const s = AC.createBufferSource(), b = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = au.nb; b.type = 'lowpass'; b.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(b); b.connect(g); g.connect(au.m); s.start(t, Math.random()); s.stop(t + d);
  };
  if(k === 'step'){ tone(75,.14,.08); tone(150,.1,.03); puff(350,.07,.05); }
  else if(k === 'land'){ tone(55,.25,.14); tone(110,.18,.05); puff(250,.2,.09); }
  else if(k === 'jump'){ tone(65,.12,.05); tone(130,.08,.02); }
  else if(k === 'ok'){ tone(660,.18,.1,'triangle'); tone(880,.25,.1,'triangle',.12); }
  else if(k === 'click'){ clickSnd(t, .06); }
  else if(k === 'radio') radioCall();
  else if(k === 'rocket') rocketRumble();
}
function suitInit(){
  au.tk = 0; au.rt = 0;
  const mkO = (type,f,g,ff) => {
    const o = AC.createOscillator(), gg = AC.createGain(), fl = AC.createBiquadFilter();
    o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = ff; gg.gain.value = g;
    o.connect(fl); fl.connect(gg); gg.connect(au.m); o.start(); return [o, gg];
  };
  const fg = mkO('sawtooth', 112, .006, 420)[1]; mkO('sawtooth', 224, .003, 500);
  const lf = AC.createOscillator(), lg = AC.createGain(); lf.frequency.value = 29; lg.gain.value = .003; lf.connect(lg); lg.connect(fg.gain); lf.start();
  mkO('sine', 58, .012, 200); mkO('sine', 116, .005, 300);
  const s = AC.createBufferSource(); s.buffer = au.nb; s.loop = true; s.start();
  const b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = 2600; b.Q.value = .8;
  const g = AC.createGain(); g.gain.value = .0035; s.connect(b); b.connect(g); g.connect(au.m);
  const tt = mkO('sawtooth', 100, 0, 500); au.to = tt[0]; au.tg = tt[1];
  const s2 = AC.createBufferSource(); s2.buffer = au.nb; s2.loop = true; s2.start();
  const b2 = AC.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = 900; b2.Q.value = 1;
  const g2 = AC.createGain(); g2.gain.value = 0; s2.connect(b2); b2.connect(g2); g2.connect(au.m); au.tn = g2; au.tb = b2;
}
function audioTick(now){
  if(!AC || !au.fan || paused || document.hidden) return;
  const t = AC.currentTime, spd = eva ? Ev.v.length() : Math.hypot(P.v.x, P.v.z);
  if(t > au.next){ padNote(); au.next = t + 4 + Math.random()*6; }
  au.hs.gain.setTargetAtTime(eva && spd > .3 ? Math.min(.1, spd*.03) : 0, t, .1);
  au.fan.gain.setTargetAtTime(.0015 + Math.min(spd, 8)*.0006, t, .2);
  if(o2 < 25 && t > au.warn){ au.warn = t + 3; beep(); }

  const k = eva ? (ea && evT[ea.i].l) : (act && act.a.l);
  const ex = Math.min(1, spd/8) + (eva ? .3 : 0) + (o2 < 30 ? .5 : 0) + (k ? .3 : 0);
  if(t > au.nb2){ breath(Math.min(1, ex)); au.nb2 = t + Math.max(1.9, 4.4 - 2.4*Math.min(1, ex)) + Math.random()*.6; }
  if(t > au.tk){ au.tk = t + 2 + Math.random()*4; clickSnd(t, .025); }
  let o = 0, n = 0, f = 100, bf = 900;
  if(k){
    if(k === 'aDrill'){ o = .018; f = 118 + 8*Math.sin(now/55); n = .014; bf = 650; }
    else if(k === 'aClean'){ n = .022*(.5 + .5*Math.sin(now/95)); bf = 1900; }
    else if(/Fix/.test(k)){ if(t > au.rt){ au.rt = t + .2; clickSnd(t, .05); } }
    else if(k === 'aMelt' || k === 'aAir'){ o = .014; f = 92; }
    else { n = .01; bf = 800; }
  }
  au.to.frequency.setTargetAtTime(f, t, .05); au.tg.gain.setTargetAtTime(o, t, .06);
  au.tn.gain.setTargetAtTime(n, t, .04); au.tb.frequency.setTargetAtTime(bf, t, .05);
}

function mark(i){

function eatPotato(){
  if(inv.pot <= 0) return toast('noFood');
  if(inv.pot === 1 && crop.st === 0) return toast('keepSeed');
  inv.pot--; hg = cl(hg + 30); note('🥔 −1 · 🍽 +30'); sfx('ok');
}

const plant = () => { if(inv.pot < 1) return toast('noSeed'); inv.pot--; crop = { st:1, m:0, t:0 }; mark(0); note('🥔 −1 → 🌱'); };
const emergencySeed = () => { inv.pot++; note('🥔 +1'); };
const waterCrop = () => { if(wt < 10) return toast('noWt'); wt -= 10; crop.m = Math.min(100, crop.m + 60); note('💧 −10'); };
const harvest = () => { inv.pot += 4; crop = { st:0, m:0, t:0 }; mark(4); note('🥔 +4'); };
const clean = i => { pan[i].dust = 0; mark(1); note('✨'); };
const fix = i => { pan[i].broken = false; mark(5); note('🔧'); };
const drill = () => { if(pw < 4) return toast('noPw'); pw -= 4; inv.ice += 2; mark(2); note('🧊 +2'); };

const align = () => { mark(7); toast('mc'); sfx('radio'); };
const salvage = () => { inv.ruin = 1; inv.part = (inv.part | 0) + 1; inv.pot += 3; mark(8); toast('salv'); save(); };

function save(){

    localStorage.setItem('qmb-save', JSON.stringify({ o2, hg, wt, pw, inv, crop, pan, done, hard, x:P.p.x, z:P.p.z }));
  }catch(e){}

function load(){
  try{
    const s = JSON.parse(localStorage.getItem('qmb-save') || 'null');
    if(!s || typeof s !== 'object') return;
    const num = (v,def,lo,hi) => Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def;
    o2 = num(s.o2, 88, 30, 100);
    hg = num(s.hg, 85, 20, 100);
    wt = num(s.wt, 60, 0, 100);
    pw = num(s.pw, 70, 0, 100);
    const si = (s.inv && typeof s.inv === 'object') ? s.inv : {};
    inv = {
      pot:Math.max(0, Math.floor(num(si.pot, 2, 0, 999))),
      ice:Math.max(0, Math.floor(num(si.ice, 0, 0, 999))),
      part:Math.max(0, Math.floor(num(si.part, 0, 0, 99))),
      ruin:si.ruin ? 1 : 0,
      st:si.st ? 1 : 0,
      ev:Array.isArray(si.ev) && si.ev.length === 3 ? si.ev.map(v => v ? 1 : 0) : [0,0,0],
      vGh:si.vGh ? 1 : 0,
      vSol:si.vSol ? 1 : 0,
      sun:num(si.sun, 0, 0, 1e9)
    };
    const sc2 = (s.crop && typeof s.crop === 'object') ? s.crop : {};
    crop = { st:Math.floor(num(sc2.st, 0, 0, 4)), m:num(sc2.m, 0, 0, 100), t:num(sc2.t, 0, 0, 25) };
    hard = !!s.hard;
    if(Array.isArray(s.pan)){
      s.pan.slice(0,3).forEach((p,i) => {
        if(p && typeof p === 'object'){
          pan[i].dust = num(p.dust, pan[i].dust, 0, 1);
          pan[i].broken = !!p.broken;
        }
      });
    }
    if(Array.isArray(s.done)) s.done.slice(0, done.length).forEach((v,i) => done[i] = !!v);
    P.p.x = num(s.x, SPAWN.x, -205, 205);
    P.p.z = num(s.z, SPAWN.z, -205, 205);
    P.p.y = H(P.p.x, P.p.z);
  }catch(e){}
}

// Compass Landmarks
const COMPASS_MARKS = [
  { x:GH.x, z:GH.z, col:'#ffb870' },
  { x:SOL.x, z:SOL.z, col:'#f2c14e' },
  { x:ICE.x, z:ICE.z, col:'#7fb8ff' },
  { x:COMMS.x, z:COMMS.z, col:'#7bd88f' },
  { x:RUIN.x, z:RUIN.z, col:'#ff9a3a' },
  { x:PAD.x, z:PAD.z, col:'#ffffff' }
];
const COMPASS_DIRS = [{ a:0, l:'N' }, { a:Math.PI/2, l:'E' }, { a:Math.PI, l:'S' }, { a:-Math.PI/2, l:'W' }];
function updateCompass(){
  if(eva || photo) return;
  const track = $("compassTrack");
  const lookAng = Math.atan2(-Math.sin(yaw), -Math.cos(yaw));
  let html = "";
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const fov = Math.PI * .78;
  for(const d of COMPASS_DIRS){
    const diff = wrap(d.a - lookAng);
    if(Math.abs(diff) < fov*.55){
      const pct = 50 + (diff / fov) * 100;
      html += `<span class="c-tick" style="left:${pct.toFixed(1)}%">${d.l}</span>`;
    }
  }
  for(const m of COMPASS_MARKS){
    const dx = m.x - P.p.x, dz = m.z - P.p.z, dist = Math.hypot(dx, dz);
    if(dist < 10) continue;
    const ang = Math.atan2(dx, dz);
    const diff = wrap(ang - lookAng);
    if(Math.abs(diff) < fov*.52){
      const pct = 50 + (diff / fov) * 100;
      html += `<span class="c-mark" style="left:${pct.toFixed(1)}%"><i class="c-dot" style="background:${m.col};color:${m.col}"></i>${Math.round(dist)}m</span>`;
    }
  }
  track.innerHTML = html;
}

canvas.addEventListener("pointerdown", e => {

{

    if(e.pointerId !== jPid) return;
    jPid = -1; joyX = 0; joyY = 0; jk.style.transform = "translate(-50%,-50%)";
  };
  jb.addEventListener("pointerup", endJoy); jb.addEventListener("pointercancel", endJoy);

  const bindHold = (id, code) => {

    el.addEventListener("pointerdown", e => { e.stopPropagation(); keys[code] = true; });

function pushOut(cx,cz,r){
  const dx = P.p.x - cx, dz = P.p.z - cz, d = Math.hypot(dx, dz);
  if(d < r && d > .001){ P.p.x = cx + dx/d*r; P.p.z = cz + dz/d*r; }
}

function snapSunShadow(targetPos){
  const mapSz = Q ? 2048 : 4096;
  const texel = 96 / mapSz;
  _lRight.crossVectors(UPV, sunDir);
  if(_lRight.lengthSq() < 1e-5) _lRight.set(1, 0, 0);
  else _lRight.normalize();
  _lUp.crossVectors(sunDir, _lRight).normalize();
  const rx = Math.round(targetPos.dot(_lRight) / texel) * texel;
  const ry = Math.round(targetPos.dot(_lUp) / texel) * texel;
  const rz = targetPos.dot(sunDir);
  _lTarget.copy(_lRight).multiplyScalar(rx).addScaledVector(_lUp, ry).addScaledVector(sunDir, rz);
  sun.position.copy(_lTarget).addScaledVector(sunDir, 200);
  sun.target.position.copy(_lTarget);
  sun.target.updateMatrixWorld();
}

function updateSun(dt){
  if(eva) return;
  sunT += dt;
  const a = Math.PI + sunT * 6.283 / 1500;
  const el = (10 + 5 * Math.sin(sunT * 6.283 / 750)) * Math.PI / 180;
  sunDir.set(Math.cos(a)*Math.cos(el), Math.sin(el), Math.sin(a)*Math.cos(el));
  placeSun();
  inv.sun = sunT;
  // Gently track sun azimuth on solar panels
  const sunYaw = Math.atan2(-sunDir.z, sunDir.x);
  for(const h of solarHeads) h.rotation.y = sunYaw;
}

function gameTick(dt, now){
  if(frozen){ for(const q in keys) keys[q] = false; return; }
  const spd = Math.hypot(P.v.x, P.v.z);
  hg = Math.max(0, hg - (.1 + Math.min(spd, 8)*.02)*dt);
  o2 = Math.max(0, o2 - .35*dt);

  let gen = 0;
  pan.forEach((p,i) => {
    p.dust = Math.min(1, p.dust + .004*dt);
    gen += p.broken ? 0 : 1 - p.dust*.75;
    rowM[i].color.copy(C0).lerp(C1, p.dust);
    rowM[i].emissive.setHex(p.broken ? (Math.sin(now*.006) > 0 ? 0x661111 : 0x220505) : 0);
  });
  pw = cl(pw + (gen*.5 - (crop.st > 0 && crop.st < 4 ? .5 : .1))*dt);

  if(crop.st > 0 && crop.st < 4){
    crop.m = Math.max(0, crop.m - .45*dt);
    if(crop.m > 0 && pw > 8){
      crop.t += dt;
      if(crop.t >= 25){ crop.t = 0; crop.st++; if(crop.st === 4) note('🥔 ✓'); }
    }
  }
  const sy = [.01, .25, .5, .75, 1][crop.st];
  cropMesh.visible = crop.st > 0; cropMesh.scale.set(1, sy, 1); cropMesh.position.y = .7*(1 - sy);

  let best = 1e9; cur = null;
  for(const q of posts){
    const d = Math.hypot(P.p.x - q.x, P.p.z - q.z);
    if(d < q.r && d < best){ const a = q.get(); if(a){ best = d; cur = { q, a }; } }
  }
  if(act && (!cur || cur.q !== act.q)) act = null;
  if(keys.KeyE && !eW && cur && !act && !transitioning) act = { q:cur.q, a:cur.a, t:0 };
  eW = !!keys.KeyE;
  if(act){
    act.t += dt;
    if(act.t >= act.a.t){ const f = act.a.run; act = null; f(); sfx('ok'); }
  }
  if(keys.KeyF && !fW) eatPotato();
  fW = !!keys.KeyF;

  // Prompt + crop pause warning at greenhouse
  let promptTxt = cur && !act ? '[E] ' + T[L][cur.a.l] : '';
  if(!act && Math.hypot(P.p.x - GH.x, P.p.z - (GH.z - 10.5)) < 4.5 && crop.st > 0 && crop.st < 4){
    if(crop.m <= 0) promptTxt = (promptTxt ? promptTxt + ' · ' : '') + '⚠ ' + T[L].cropDry;
    else if(pw <= 8) promptTxt = (promptTxt ? promptTxt + ' · ' : '') + '⚠ ' + T[L].cropNoPw;
  }
  $("prompt").textContent = promptTxt;
  $("prog").className = act ? "on" : "";
  if(act) $("prog").firstElementChild.style.width = (act.t / act.a.t * 100) + "%";

  // Atmospheric first-arrival narrative toasts
  if(!inv.vGh && Math.hypot(P.p.x - GH.x, P.p.z - GH.z) < 15){ inv.vGh = 1; toast('gh'); }
  if(!inv.vSol && Math.hypot(P.p.x - SOL.x, P.p.z - SOL.z) < 15){ inv.vSol = 1; toast('sol'); }
  if(Math.hypot(P.p.x - CR.x, P.p.z - CR.z) < CR.r + 8 && !done[6]){ mark(6); toast('cr'); }

  uiT += dt;
  if(uiT > .22){ uiT = 0; updateHudBars(); updateCompass(); }
  sv += dt; if(sv > 5){ sv = 0; save(); }
  if(hg <= 0 || o2 <= 0) down();
}

function evaFrame(dt, now){
  const cp = Math.cos(pitch), fx = -Math.sin(yaw)*cp, fy = -Math.sin(pitch), fz = -Math.cos(yaw)*cp;
  const rx = Math.cos(yaw), rz = -Math.sin(yaw);
  const iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) + joyY;
  const ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joyX;
  const iy = (keys.Space ? 1 : 0) - ((keys.ShiftLeft || keys.ShiftRight) ? 1 : 0);

  const tx = fx*iz + rx*ix, ty = fy*iz + iy, tz = fz*iz + rz*ix;
  Ev.v.x += tx*3*dt; Ev.v.y += ty*3*dt; Ev.v.z += tz*3*dt;
  const sp = Ev.v.length(); if(sp > 4) Ev.v.multiplyScalar(4/sp);
  if(Math.hypot(iz, ix, iy) < .05) Ev.v.multiplyScalar(Math.max(0, 1 - .8*dt));
  Ev.p.addScaledVector(Ev.v, dt);

  // Cold-gas thruster spray opposite thrust vector
  const thrustMag = Math.hypot(tx, ty, tz);
  if(thrustMag > .15){
    sprayGas(Ev.p.x, Ev.p.y + 1.15, Ev.p.z, -tx/thrustMag, -ty/thrustMag, -tz/thrustMag, 2);
  }
  for(let i = 0; i < GN; i++){
    if(glife[i] > 0){
      glife[i] -= dt; const j = i*3;
      gpos[j] += gvel[j]*dt; gpos[j+1] += gvel[j+1]*dt; gpos[j+2] += gvel[j+2]*dt;
      if(glife[i] <= 0) gpos[j+1] = -999;
    }
  }
  gg.attributes.position.needsUpdate = true;

  for(const c of evC){
    const dx = Ev.p.x - (O.x + c[0]), dy = Ev.p.y - (O.y + c[1]), dz = Ev.p.z - (O.z + c[2]);
    const d = Math.hypot(dx, dy, dz);
    if(d < c[3] && d > .001){
      const k = c[3] / d;
      Ev.p.set(O.x + c[0] + dx*k, O.y + c[1] + dy*k, O.z + c[2] + dz*k);
      Ev.v.multiplyScalar(.5);
    }
  }
  _evAnchor.set(O.x, O.y, O.z + 3);
  _evDiff.copy(_evAnchor).sub(Ev.p);
  const dl = _evDiff.length();
  if(dl > 36){
    Ev.v.addScaledVector(_evDiff.normalize(), (dl - 36)*3*dt);
    if(now - tw > 4000){ tw = now; toast('tether'); }
  }
  const tp = tl.geometry.attributes.position;
  tp.setXYZ(0, _evAnchor.x, _evAnchor.y, _evAnchor.z);
  tp.setXYZ(1, Ev.p.x, Ev.p.y + .9, Ev.p.z);
  tp.needsUpdate = true;

  astro.position.copy(Ev.p); astro.rotation.y = Math.atan2(fx, fz);
  body.rotation.x += ((iz ? .4 : .1) - body.rotation.x)*Math.min(1, 4*dt);
  if(ea){
    const w = Math.sin(now * .014) * .35;
    armL.rotation.x = -.9 + w; armR.rotation.x = -.9 - w;
  }else{
    armL.rotation.x = -.5; armR.rotation.x = -.5;
  }
  beacon.material.emissiveIntensity = .4 + .9*Math.max(0, Math.sin(now*.004));

  o2 = Math.max(0, o2 - .5*dt);
  hg = Math.max(0, hg - .1*dt);
  if(keys.KeyF && !fW) eatPotato();
  fW = !!keys.KeyF;

  let near = -1, bd = 3.6;
  evT.forEach((t,i) => { if(!inv.ev[i]){ const d = Ev.p.distanceTo(t.p); if(d < bd){ bd = d; near = i; } } });
  if(ea && ea.i !== near) ea = null;
  if(keys.KeyE && !eW && near >= 0 && !ea && !transitioning){
    if(near === 0 && (inv.part | 0) < 1) toast('noPart');
    else ea = { i:near, t:0 };
  }
  eW = !!keys.KeyE;
  if(ea){
    ea.t += dt;
    if(ea.t >= 4){
      const i = ea.i; ea = null; inv.ev[i] = 1; sfx('ok');
      if(i === 0) inv.part = Math.max(0, (inv.part | 0) - 1);
      applyFix(); note('🔧'); save();
      if(inv.ev.every(Boolean)){
        inv.st = 1; mark(10); toast('evaDone');
        evaReturnTimer = setTimeout(startReturnTransition, 3600);
      }
    }
  }
  $("prompt").textContent = near >= 0 && !ea ? '[E] ' + T[L][evT[near].l] : '';
  $("prog").className = ea ? 'on' : '';
  if(ea) $("prog").firstElementChild.style.width = (ea.t / 4 * 100) + '%';
  evM.forEach((m,i) => m.scale.setScalar(inv.ev[i] ? 1 : 1 + .25*Math.sin(now*.006)));

  _camTarget.set(Ev.p.x, Ev.p.y + 1, Ev.p.z);
  camera.position.set(_camTarget.x + Math.sin(yaw)*cp*zoom, _camTarget.y + Math.sin(pitch)*zoom, _camTarget.z + Math.cos(yaw)*cp*zoom);
  if(shakeT > 0){
    shakeT = Math.max(0, shakeT - dt);
    camera.position.x += (Math.random() - .5)*.14*shakeT;
    camera.position.y += (Math.random() - .5)*.14*shakeT;
  }
  camera.lookAt(_camTarget);
  snapSunShadow(Ev.p);
  sky.position.copy(camera.position); earth.rotation.y += .02*dt;

  uiT += dt; if(uiT > .22){ uiT = 0; updateHudBars(); }
  if(keys.KeyR && eva && !transitioning) startReturnTransition();
  else if(o2 <= 0 || hg <= 0){ exitEVAImmediate(); down(); }
}

load();
sunT = inv.sun || 0;
setQ(Q);
renderUI();

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if(paused){ renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  audioTick(now);
  updateSun(dt);
  if(eva){ evaFrame(dt, now); renderer.render(scene, camera); requestAnimationFrame(frame); return; }

  const iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) + joyY;
  const ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + joyX;
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  let mx = fx*iz + rx*ix, mz = fz*iz + rz*ix;
  const ml = Math.hypot(mx, mz); if(ml > 1){ mx /= ml; mz /= ml; }
  let sp = (keys.ShiftLeft || keys.ShiftRight) ? 7 : 3.4;

  // Slope physics: uphill slightly slower, downhill slight momentum
  if(P.g && ml > .05){
    const n = normalAt(P.p.x, P.p.z, _vNorm);
    const uphill = -(mx*n.x + mz*n.z);
    sp *= Math.max(.62, Math.min(1.22, 1 - uphill*.85));
  }
  const k = P.g ? Math.min(1, 10*dt) : (ml > .05 ? Math.min(1, 1.2*dt) : 0);
  P.v.x += (mx*sp - P.v.x)*k; P.v.z += (mz*sp - P.v.z)*k;

  if(keys.Space && P.g && !frozen && !transitioning){
    P.v.y = 3.3; P.g = false; hg -= 1.2; sfx('jump'); burst(P.p.x, P.p.y, P.p.z, 26, 2.6);
  }else if(P.g && ml > .1 && (keys.ShiftLeft || keys.ShiftRight) && !frozen && !transitioning){
    P.v.y = 1.3; P.g = false; hg -= .5; burst(P.p.x, P.p.y, P.p.z, 8, 1.8);
  }

  P.v.y -= 1.62*dt;
  P.p.x += P.v.x*dt; P.p.z += P.v.z*dt; P.p.y += P.v.y*dt;
  pushOut(GH.x, GH.z, 9.3); pushOut(LAND.x, LAND.z, 3.8);
  for(const c of COL) pushOut(c[0], c[1], c[2]);
  // 3D height-aware rock collision (jump cleanly over low rocks)
  for(const r of ROCKS) if(P.p.y < r[3]) pushOut(r[0], r[1], r[2]);

  const rr = Math.hypot(P.p.x, P.p.z);
  if(rr > 205){ P.p.x *= 205/rr; P.p.z *= 205/rr; if(now - edgeT > 6000){ edgeT = now; toast("edge"); } }

  const g = H(P.p.x, P.p.z);
  if(P.p.y <= g + (P.g ? .35 : 0)){
    if(!P.g && P.v.y < -1.2){
      sfx('land'); burst(P.p.x, g, P.p.z, 34, 3);
      const cx = Math.cos(P.h)*.18, cz = Math.sin(P.h)*.18;
      print(P.p.x - cx, P.p.z + cz, P.h); print(P.p.x + cx, P.p.z - cz, P.h);
    }
    P.p.y = g; P.v.y = 0; P.g = true;
  }else if(P.p.y > g + .36) P.g = false;

  const spd = Math.hypot(P.v.x, P.v.z);
  if(ml > .05){
    let d = Math.atan2(mx, mz) - P.h; d = Math.atan2(Math.sin(d), Math.cos(d));
    P.h += d*Math.min(1, 10*dt);
  }
  if(P.g && spd > .4){
    P.ph += spd*dt*2.4; P.dist += spd*dt;
    if(P.dist > 1.1){
      P.dist = 0; P.side *= -1;
      print(P.p.x + Math.cos(P.h)*.18*P.side, P.p.z - Math.sin(P.h)*.18*P.side, P.h);
      burst(P.p.x, g, P.p.z, 2, .9); sfx('step');
    }
  }

  // Astronaut Animation (walking, jumping, or working on [E] action)
  const air = !P.g, s = Math.sin(P.ph), c = Math.cos(P.ph), sw = air ? 0 : Math.min(1, spd/3.4)*.6, up = P.v.y > 0, bt = Math.min(1, 8*dt);
  const workLean = act ? .24 : 0;
  body.rotation.x += (Math.min(.32, spd*.045) + (air ? .12 : 0) + workLean - body.rotation.x)*bt;
  body.position.y = .88 + (air ? 0 : Math.abs(s)*.04*Math.min(1, spd/3));
  legL.rotation.x = air ? (up ? -.8 : -.35) : s*sw*1.1;
  legR.rotation.x = air ? (up ? .25 : -.2) : -s*sw*1.1;
  legL.knee.rotation.x = air ? (up ? .5 : .9) : Math.max(0, -c)*sw*1.4;
  legR.knee.rotation.x = air ? (up ? .2 : .7) : Math.max(0, c)*sw*1.4;
  if(act){
    const w = Math.sin(now * .014) * .35;
    armL.rotation.x = -.85 + w; armR.rotation.x = -.85 - w;
    armL.rotation.z = -.12; armR.rotation.z = .12;
    armL.elbow.rotation.x = armR.elbow.rotation.x = -.6;
  }else{
    armL.rotation.x = air ? -.7 : -s*sw; armR.rotation.x = air ? -.7 : s*sw;
    armL.rotation.z = air ? -.7 : -.06; armR.rotation.z = air ? .7 : .06;
    armL.elbow.rotation.x = armR.elbow.rotation.x = -.35;
  }
  beacon.material.emissiveIntensity = .4 + .9*Math.max(0, Math.sin(now*.004));
  astro.position.copy(P.p); astro.rotation.y = P.h;

  // Parabolic lunar dust
  for(let i = 0; i < DN; i++){
    if(dlife[i] > 0){
      dlife[i] -= dt; const j = i*3;
      dvel[j+1] -= 1.62*dt;
      dpos[j] += dvel[j]*dt; dpos[j+1] += dvel[j+1]*dt; dpos[j+2] += dvel[j+2]*dt;
      if(dpos[j+1] < H(dpos[j], dpos[j+2]) || dlife[i] <= 0){ dlife[i] = 0; dpos[j+1] = -999; }
    }
  }
  dg.attributes.position.needsUpdate = true;

  // Camera & Shake
  _camTarget.set(P.p.x, P.p.y + 1.5, P.p.z);
  camera.position.set(
    _camTarget.x + Math.sin(yaw)*Math.cos(pitch)*zoom,
    _camTarget.y + Math.sin(pitch)*zoom,
    _camTarget.z + Math.cos(yaw)*Math.cos(pitch)*zoom
  );
  const cg = H(camera.position.x, camera.position.z) + 1;
  if(camera.position.y < cg) camera.position.y = cg;
  if(shakeT > 0){
    shakeT = Math.max(0, shakeT - dt);
    camera.position.x += (Math.random() - .5)*.14*shakeT;
    camera.position.y += (Math.random() - .5)*.14*shakeT;
  }
  camera.lookAt(_camTarget);

  snapSunShadow(P.p);
  sky.position.copy(camera.position);
  earth.rotation.y += .02*dt;

  gameTick(dt, now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
